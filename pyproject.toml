[project]
name = "bloqade-python-mis"
version = "0.1.0"
description = "A plug-in for generating MIS problems for Bloqade"
authors = [
    {name = "Phillip Weinberg", email = "pweinberg@quera.com"},
]
dependencies = [
    "bloqade==0.34.0",
    "numpy==2.2.6",
    "networkx==3.2.1",
    "scikit-optimize==0.10.2",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache 2.0"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.black]
line-length = 88

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Assume Python 3.9.
target-version = "py39"

[tool.pdm]
[tool.pdm.dev-dependencies]
dev = [
    "twine>=4.0.2",
    "ipython>=8.12.0",
    "black>=23.12.1",
    "pytest>=7.3.1",
    "mypy>=1.2.0",
    "ipykernel>=6.22.0",
    "jupyter>=1.0.0",
    "ruff>=0.1.9",
    "pre-commit>=3.3.1",
    "coverage>=7.2.5",
    "jupytext>=1.14.5",
    "pytest-recording>=0.12.2",
    "vcrpy==4.4.0",
    "pyinstrument>=4.5.3",
    "scikit-optimize>=0.9.0",
    "matplotlib>=3.8.1",
    "icecream>=2.1.3",
    "-e file:///${PROJECT_ROOT}/bloqade-python#egg=bloqade",
]

[tool.pdm.scripts]
_.env_file = "./.env"
upload = "python -m twine upload -r bloqade dist/*"
build = {cmd = "pdm build"}
publish = {composite = ["build", "upload"]}
test = {shell = "git clean -f && pytest tests"}
coverage = {shell = "git clean -f && coverage run -m pytest tests/ && coverage xml && coverage report"}
coverage-html = {shell = "git clean -f && coverage run -m pytest tests/ && coverage html && open htmlcov/index.html"}

[tool.jupytext]
formats = "ipynb,py:percent"
hide_notebook_metadata = false
